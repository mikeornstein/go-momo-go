name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required source files
        run: |
          set -euo pipefail
          test -f source/main.lua
          test -f source/pdxinfo
          grep -qE '^name=.+' source/pdxinfo
          grep -qE '^author=.+' source/pdxinfo
          grep -qE '^bundleID=com\.[A-Za-z0-9.-]+$' source/pdxinfo
          grep -qE '^version=.+' source/pdxinfo
          grep -qE '^buildNumber=[0-9]+$' source/pdxinfo
          echo "Source layout and pdxinfo keys OK."

      - name: No compiled Playdate bundles committed
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.pdx(/|$)' ; then
            echo "Compiled .pdx bundles must not be committed." >&2
            exit 1
          fi
          echo "No committed .pdx bundles."
